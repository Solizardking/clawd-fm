version: "3.9"

services:
  clawd-fm:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: clawd-fm
    restart: unless-stopped
    ports:
      - "9669:9669"
      - "8080:8080"
    volumes:
      - clawd-data:/data
    environment:
      CLAWD_FM_NAME: "CLAWD FM"
      CLAWD_FM_ADDR: ":9669"
      CLAWD_SOL_NETWORK: "${CLAWD_SOL_NETWORK:-devnet}"
      CLAWD_SOL_KEYFILE: "/data/solana-keypair.json"
      CLAWD_HTTP_ADDR: ":8080"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9669"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  clawd-data:
    driver: local
