# Render Blueprint — CLAWD FM Backend
# https://render.com/docs/blueprint-spec
#
# Steps:
#   1. Push this repo to GitHub.
#   2. In Render dashboard: Blueprint → Connect repo.
#   3. Add env vars: CLAWD_SOL_NETWORK=devnet, and optionally CLAWD_SOL_KEYFILE as secret.
#   4. Deploy — the HTTP API will be at https://clawd-fm.onrender.com.
#
# Render injects $PORT automatically. The entrypoint.sh and Go server
# handle mapping $PORT to the HTTP listen address.

services:
  - type: web
    name: clawd-fm
    env: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: CLAWD_FM_NAME
        value: CLAWD FM
      - key: CLAWD_FM_ADDR
        value: ":9669"
      - key: CLAWD_SOL_NETWORK
        value: devnet