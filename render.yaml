# Render Blueprint — CLAWD FM Backend
# https://render.com/docs/blueprint-spec
#
# Deploy the Go backend on Render, then point the Vercel frontend at it.
#
# Steps:
#   1. Push this repo to GitHub.
#   2. In Render dashboard: Blueprint → Connect repo.
#   3. Add a secret env var: CLAWD_SOL_KEYFILE (optional, for Solana ops).
#   4. Set CLAWD_SOL_NETWORK=devnet (or mainnet).
#   5. Deploy — the HTTP API will be at https://clawd-fm.onrender.com.
#
# Render injects $PORT automatically. The entrypoint.sh and Go server
# handle mapping $PORT to the HTTP listen address.

services:
  - type: web
    name: clawd-fm
    env: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CLAWD_FM_NAME
        value: CLAWD FM
      - key: CLAWD_FM_ADDR
        value: ":9669"
      - key: CLAWD_SOL_NETWORK
        value: devnet
    disks:
      - name: data
        mountPath: /data
        sizeGB: 1