# Render Blueprint — CLAWD FM Backend
# https://render.com/docs/blueprint-spec
#
# Deploy the Go backend on Render, then point the Vercel frontend at it.
#
# Steps:
#   1. Push this repo to GitHub.
#   2. In Render dashboard: Blueprint → Connect repo.
#   3. Set the CLAWD_SOL_KEYFILE secret (optional, for Solana ops).
#   4. Set CLAWD_SOL_NETWORK=devnet (or mainnet).
#   5. Deploy — the HTTP API will be at https://clawd-fm.onrender.com.

services:
  - type: web
    name: clawd-fm
    env: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CLAWD_FM_NAME
        value: CLAWD FM
      - key: CLAWD_FM_ADDR
        value: ":9669"
      - key: CLAWD_HTTP_ADDR
        value: ":8080"
      - key: CLAWD_SOL_NETWORK
        value: devnet
      - key: CLAWD_SOL_KEYFILE
        sync: false   # set manually in Render dashboard if needed
      - key: PORT
        value: 8080    # Render expects this; we use CLAWD_HTTP_ADDR
    disks:
      - name: data
        mountPath: /data
        sizeGB: 1